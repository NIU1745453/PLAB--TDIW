
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión - Veleria</title>
    <link rel="stylesheet" href="css/uab.css">
    <script src="js/funcions.js" defer></script>
</head>
<body>

    <header>
        <h1><a href="index.html">Veleria</a></h1>
    </header>

    <main class="login-container">
        <form id="formLogin" class="login-form">
            <h2>Iniciar sesión</h2>
            <p>Introduce tus datos para acceder a tu cuenta.</p>

            <label for="usuario">Nombre de usuario</label>
            <input
                type="text"
                id="usuario"
                name="usuario"
                placeholder="Tu nombre de usuario"
                required
            >

            <label for="password">Contraseña</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Tu contraseña"
                required
            >

            <button type="button" onclick="window.location.href='index.html'">
                Entrar
            </button>

            <p id="mensajeLogin" role="status"></p>

            <a href="index.html">Volver a la tienda</a>
        </form>
    </main>

</body>
</html>
