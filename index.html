<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Veleria</title>

    <link rel="stylesheet" href="css/uab.css">
    <script src="js/functions.js" defer></script>
</head>

<body>
    <header>
        <div class="menu">
            <button
                id="menuButton"
                type="button"
                aria-label="Mostrar categorías"
                aria-expanded="false"
                aria-controls="menuCategorias">
                ☰
            </button>

            <div id="menuCategorias" class="menu-categorias" hidden>
                <p>Categorías</p>
                <div id="categories">
                    <span>Cargando categorías...</span>
                </div>
            </div>
        </div>

        <h1>
            <a href="index.html">Veleria</a>
        </h1>

        <div class="buscador">
            <button type="button">Search</button>
            <input type="text" aria-label="Buscar productos">

            <button type="button" id="botonLogin">
                Log in
            </button>
        </div>
    </header>

    <section class="carrusel">
        <img
            id="imagenCarrusel"
            src="./img_carrousel/img1.jpg"
            alt="Imagen destacada de Veleria">

        <button
            type="button"
            id="anterior"
            class="flecha anterior"
            aria-label="Imagen anterior">
            &#10094;
        </button>

        <button
            type="button"
            id="siguiente"
            class="flecha siguiente"
            aria-label="Imagen siguiente">
            &#10095;
        </button>
    </section>

    <section class="contingut">
        <h2 id="tituloProductos">Lo más vendido</h2>

        <div id="product-list" class="productes">
            <article class="prod1">
                <div class="img">
                    <img src="img/img1.jpg" alt="Producto 1">
                </div>
                <p>Descripción del producto 1</p>
            </article>

            <article class="prod2">
                <div class="img">
                    <img src="img/img2.jpg" alt="Producto 2">
                </div>
                <p>Descripción del producto 2</p>
            </article>

            <article class="prod3">
                <div class="img">
                    <img src="img/img3.jpg" alt="Producto 3">
                </div>
                <p>Descripción del producto 3</p>
            </article>

            <article class="prod4">
                <div class="img">
                    <img src="img/img4.jpg" alt="Producto 4">
                </div>
                <p>Descripción del producto 4</p>
            </article>

            <article class="prod5">
                <div class="img">
                    <img src="img/img5.jpg" alt="Producto 5">
                </div>
                <p>Descripción del producto 5</p>
            </article>

            <article class="prod6">
                <div class="img">
                    <img src="img/img6.jpg" alt="Producto 6">
                </div>
                <p>Descripción del producto 6</p>
            </article>
        </div>
    </section>
    <main>
        
    </main>
    <footer>
        <p>Links e imagen del logo</p>
    </footer>
</body>
</html>
